name: Validate & Deploy Razavi CMOS Brain to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Knowledge Brain integrity (10 domains, coordinates, GitHub catalog, SVGs, math & SHA-256)
        run: python3 -B validators/validate_brain.py

      - name: Validate SKILL-ANALOG Runtime manifest & reference links
        run: |
          python3 -B runtime/tools/analogctl.py verify
          python3 -B runtime/tools/check_references.py

      - name: Validate Web UI JavaScript syntax
        run: node --check site/app.js

      - name: Assemble _site (Interactive Coordinate Web App + Static Machine KB & Runtime Endpoints)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r site/* _site/
          cp -r kb _site/kb
          cp -r runtime _site/runtime
          cp -r skills _site/skills
          test -f _site/kb/coordinates/book-coordinates.json
          test -f _site/kb/github-skills/catalog.json
          test -f _site/runtime/manifest.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
