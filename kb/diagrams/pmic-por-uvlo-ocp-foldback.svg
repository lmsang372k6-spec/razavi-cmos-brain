  <text x="445" y="206" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#0f172a" text-anchor="middle">• POR_B (Brownout Rst)</text>
  <text x="445" y="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#2563eb" text-anchor="middle" font-weight="bold">• UVLO: 2.85V / 2.60V</text>
  <text x="445" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#dc2626" text-anchor="middle" font-weight="bold">• TSD: 150°C / 130°C</text>
  <text x="445" y="260" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#d97706" text-anchor="middle">• Hiccup OCP Retry</text>
