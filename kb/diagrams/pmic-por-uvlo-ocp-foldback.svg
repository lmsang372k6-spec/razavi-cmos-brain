  <text x="48" y="460" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#1d4ed8" text-anchor="start" font-weight="bold">Hysteretic UVLO Chatter &amp; Brownout Pitfalls</text>
  <text x="48" y="477" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Exact UVLO Hysteresis:  ΔV_hys = V_ON − V_OFF = I_hys · R_U1  (typ. 200–300 mV).</text>
  <text x="48" y="493" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Without ΔV_hys &gt; I_in,max · R_src: Turning ON heavy load drops VDD = V_bat − I_in·R_src</text>
  <text x="48" y="509" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  below threshold -&gt; regulator chatters ON/OFF at kHz!</text>
  <text x="48" y="525" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Glitch / Brownout Test: Always verify 10 µs fast VDD dips reset POR &amp; C_SS cleanly!</text>
