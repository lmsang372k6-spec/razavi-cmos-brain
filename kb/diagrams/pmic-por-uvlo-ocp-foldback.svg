  <text x="600" y="439" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Brick-Wall Short-Circuit Dissipation (Vout = 0 -&gt; full Vin across pass FET!):</text>
  <text x="600" y="455" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">    P_SC,brick = Vin · I_lim   &gt;&gt;   P_SOA = (T_J,max − T_A) / θ_JA !</text>
  <text x="600" y="471" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Foldback Current Limit scales sense threshold with Vout:</text>
  <text x="600" y="487" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">    I_short ≈ (0.2 .. 0.3) · I_lim   =&gt;   cuts short-circuit heat by 3–5x!</text>
  <text x="600" y="503" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Foldback Startup Lockout Caveat: Constant-current loads can latch at a</text>
  <text x="600" y="519" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">  false low-Vout intersection -&gt; pair with Hiccup Timer (5% retry duty)!</text>
