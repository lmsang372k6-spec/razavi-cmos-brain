  <text x="288" y="344" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#d97706" text-anchor="middle" font-weight="bold">Monotonic Soft-Start Ramp:  V_EA+ = min( V_SS(t) , V_REF )</text>
  <text x="288" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="middle">• I_SS (1 µA) -&gt; C_SS (10 nF) ramps Vout linearly over t_SS = C_SS·V_REF / I_SS ≈ 6 ms,</text>
  <text x="288" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#059669" text-anchor="middle" font-weight="bold">  clamping capacitive inrush current  I_inrush = Cout · (Vout / t_SS) &lt;&lt; I_OCP !</text>
  <text x="288" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#dc2626" text-anchor="middle">• Fast pull-down NMOS discharges C_SS -&gt; 0 V immediately on ANY UVLO / TSD / EN=0 trip!</text>
