  <rect x="36" y="452" width="494" height="110" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="39" y1="458" x2="39" y2="556" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="48" y="470" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="bold">Full Transconductance Restoration (§4.3 / §5.3)</text>
  <text x="48" y="487" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• M1 pulls +gm1·vin/2 from M3 -&gt; M4 mirrors +gm1·vin/2 into Vout;</text>
  <text x="48" y="503" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  simultaneously M2 pushes +gm1·vin/2 into Vout -&gt; Iout = gm1·vin !</text>
  <text x="48" y="519" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Voltage Gain:  Av = gm1 · (ro2 || ro4)   (2x single-side gain!).</text>
  <rect x="586" y="112" width="456" height="146" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="589" y1="118" x2="589" y2="252" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="598" y="130" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="bold">1. Two Parallel Signal Paths -&gt; Pole-Zero Doublet (§6.6)</text>
  <text x="598" y="147" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Path 1 (Direct via M2): Instantaneous current +gm1·vin/2 -&gt; Vout.</text>
  <text x="598" y="163" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Path 2 (Mirrored M1-&gt;M3-&gt;M4): Delayed by mirror pole</text>
  <text x="598" y="179" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  ω_p,m ≈ gm3 / CX   where CX = CGS3 + CGS4 + CDB1 + CDB3.</text>
  <text x="598" y="195" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Summing both paths creates an LHP Zero at ω_z = 2 · ω_p,m !</text>
  <text x="598" y="211" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  Close pole-zero doublet causes slow exponential settling tail!</text>
  <rect x="586" y="274" width="456" height="136" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="589" y1="280" x2="589" y2="404" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="598" y="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="bold">2. Common-Mode Rejection Ratio (CMRR) Miracle</text>
  <text x="598" y="309" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Even with finite tail impedance RSS = ro5, diode M3 senses</text>
  <text x="598" y="325" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  common-mode tail current ΔICM/(1+2gm1·RSS) and M4 cancels it!</text>
  <text x="598" y="341" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Perfect symmetry gives Av,CM ≈ -1 / (2·gm3·RSS) &lt;&lt; 1,</text>
  <text x="598" y="357" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  yielding  CMRR = |Av,DM / Av,CM| ≈ 2·gm1·RSS · gm3·(ro2||ro4) !</text>
  <rect x="586" y="426" width="456" height="134" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="589" y1="432" x2="589" y2="554" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="598" y="444" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="bold">3. Systematic Offset Trap in 5T-OTA</text>
  <text x="598" y="461" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Node X sits at VX = VDD - |VGS3|, while Vout may sit elsewhere!</text>
  <text x="598" y="477" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• If Vout ≠ VX, channel-length modulation |VDS4| ≠ |VDS3| creates</text>
  <text x="598" y="493" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  systematic input offset VOS,sys = ΔVDS / [gm1·(ro2||ro4)] !</text>
</svg>
