  <text x="48" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#1d4ed8" text-anchor="start" font-weight="bold">Why BOTH Parasitics Cp1 &amp; Cp2 Vanish from H(z) (§13.4)</text>
  <text x="48" y="421" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Cp1 (Left Plate): Charged to Vin during φ1, then discharged harmlessly to GND via S2</text>
  <text x="48" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  during φ2 (never flows through S4 into virtual ground!).</text>
  <text x="48" y="453" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Cp2 (Right Plate): Grounded during φ1 (V=0), then connected to OTA Virtual Ground</text>
  <text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  (V≈0) during φ2 -&gt; ΔV_Cp2 = 0 -&gt; steals ZERO signal charge (provided A0 &gt;&gt; 1)!</text>
  <text x="48" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Exact Delayed Non-Inverting Transfer Function:</text>
  <text x="48" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  H(z) = Vout(z) / Vin(z) = + (CS / CI) · [ z⁻¹ / (1 - z⁻¹) ] !</text>
  <text x="690" y="138" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#059669" text-anchor="start" font-weight="bold">φ1e</text>
