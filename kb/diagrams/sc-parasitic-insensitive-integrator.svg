  <text x="852" y="165" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#059669" text-anchor="start" font-weight="bold">φ1e opens Δt BEFORE φ1!</text>
  <text x="690" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="bold">φ2</text>
  <polyline points="728,264 870,264 878,236 1002,236 1010,264 1035,264" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
