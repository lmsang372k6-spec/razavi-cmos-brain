  <rect x="688" y="314" width="356" height="246" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="691" y1="320" x2="691" y2="554" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="700" y="332" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#b45309" text-anchor="start" font-weight="bold">Clock &amp; Settling Invariants</text>
  <text x="700" y="349" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">1. Non-Overlap Deadtime t_nov:</text>
  <text x="700" y="365" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   If φ1 &amp; φ2 overlap even 20 ps, CI discharges</text>
  <text x="700" y="381" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   straight to Vin/GND -&gt; catastrophic integrator leak!</text>
  <text x="700" y="397" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">2. Early φ1e Rule (Bottom-Plate Sampling):</text>
  <text x="700" y="413" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   S3 opens at V=0 -&gt; constant Vin-independent Qinj;</text>
  <text x="700" y="429" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   then Node B is floating so S1 opening injects ZERO Q!</text>
  <text x="700" y="445" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">3. Settling Within T_φ2 = T_clk/2 - t_nov:</text>
  <text x="700" y="461" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   t_slew + N_τ · τ_closed &lt; T_φ2  where</text>
  <text x="700" y="477" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   β = CI / (CI + CS + Cin)  and  τ = 1 / (β · ωu).</text>
</svg>
