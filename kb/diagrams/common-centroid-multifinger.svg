  <line x1="553" y1="392" x2="553" y2="554" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="562" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#b45309" text-anchor="start" font-weight="bold">Nanometer Layout Matching Checklist (90nm / 65nm / 45nm)</text>
  <text x="562" y="421" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Same Orientation: Current MUST flow parallel (never rotate 90°!).</text>
  <text x="562" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Common-Centroid [A B / B A] or 1D [A B B A]: Identical center</text>
  <text x="562" y="453" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  of gravity (Xc, Yc) cancels 1st-order tox, VTH &amp; ΔT gradients!</text>
  <text x="562" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Dummy Poly &amp; Active Strips: Equalize poly etch micro-loading</text>
  <text x="562" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  AND equalize STI Mechanical Stress (LOD) across all fingers!</text>
  <text x="562" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Well Proximity Effect (WPE): Keep matched pairs far &amp; equidistant</text>
  <text x="562" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  from N-Well edges where scattered implant ions shift VTH!</text>
