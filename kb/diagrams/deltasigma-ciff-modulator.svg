  <text x="222" y="375" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="bold">Jitter &amp; Noise Unshaped!</text>
  <line x1="334" y1="362" x2="298" y2="362" stroke="#7c3aed" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arr-purple)"/>
