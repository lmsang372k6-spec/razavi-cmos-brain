  <text x="410" y="375" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle">Shapes ΔI_DAC by (1−z⁻¹)</text>
