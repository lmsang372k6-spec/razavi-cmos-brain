  <line x1="39" y1="424" x2="39" y2="580" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="48" y="436" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#1d4ed8" text-anchor="start" font-weight="bold">CIFF vs CIFB, DWA Mismatch Shaping &amp; CT Jitter</text>
  <text x="48" y="453" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Why CIFF Wins Low-Power: Direct U -&gt; Σ_FF cancels Vin at Σ1, so I1..IL</text>
  <text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">  process ONLY tiny quantization noise -&gt; 5x smaller OTA swing &amp; power!</text>
  <text x="48" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Why DWA Is Mandatory for Multi-Bit DAC1: Outer DAC1 nonlinearity adds</text>
  <text x="48" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">  DIRECTLY to input; DWA rotates elements cyclically to push mismatch out-of-band!</text>
  <text x="48" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• CT-ΔΣ Inherent Anti-Aliasing vs Clock Jitter: Free sinc alias rejection at</text>
  <text x="48" y="533" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">  f_s, but NRZ DAC1 pulse-width jitter σ_t limits SNR -&gt; use FIR-DAC or SCR!</text>
