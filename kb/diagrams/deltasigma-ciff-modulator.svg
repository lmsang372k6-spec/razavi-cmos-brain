  <text x="925" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="bold">|NTF(f)|² (+20·L dB/dec!)</text>
  <path d="M 656 172 L 736 172 Q 752 176 762 346" fill="none" stroke="#7c3aed" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,3"/>
  <text x="838" y="166" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#7c3aed" text-anchor="start" font-weight="bold">Digital Decimation Filter</text>
  <rect x="620" y="396" width="444" height="190" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="623" y1="402" x2="623" y2="580" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="632" y="414" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#b45309" text-anchor="start" font-weight="bold">In-Band SQNR Law &amp; Lee's Out-of-Band Gain Rule</text>
  <text x="632" y="431" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• Peak SQNR (Order L, B-bit Quantizer, OSR = f_s / (2·f_B)):</text>
  <text x="632" y="447" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">    SQNR ≈ 6.02·B + 1.76 − 10·log10(π^(2L)/(2L+1)) + (20L+10)·log10(OSR)</text>
  <text x="632" y="463" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• Resolution Gained per Octave (2x) of OSR:</text>
  <text x="632" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">    L = 1: +9 dB (1.5b)  |  L = 2: +15 dB (2.5b)  |  L = 3: +21 dB (3.5b)!</text>
  <text x="632" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• Lee's Stability Criterion: Bound ||NTF||_∞ &lt; 1.5 (1-bit) or 2.5–3.5</text>
  <text x="632" y="511" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">  (multi-bit) so high-frequency quantization peaks never overload loop!</text>
</svg>
