  <circle cx="564" cy="132" r="3.5" fill="#059669"/>
  <circle cx="564" cy="425" r="3.5" fill="#0f172a"/>
  <rect x="470" y="474" width="168" height="84" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="554" y="496" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">VSSA &lt;-&gt; VSSD Bridge</text>
  <text x="554" y="515" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="middle">Back-to-Back ESD Diodes:</text>
  <text x="554" y="532" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#059669" text-anchor="middle">Blocks ±0.4V digital bounce,</text>
  <text x="554" y="548" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#dc2626" text-anchor="middle" font-weight="bold">shunts 2 A ESD zap safely!</text>
  <line x1="492" y1="425" x2="492" y2="474" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4,3"/>
  <rect x="36" y="470" width="418" height="92" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="39" y1="476" x2="39" y2="556" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="48" y="488" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#b91c1c" text-anchor="start" font-weight="bold">HBM (+2 kV) Complete Current Return Loop</text>
  <text x="48" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">• Zap Pin (+) wrt VSSA (-): Current flows PAD -&gt; D_P -&gt; VDDA bus -&gt;</text>
  <text x="48" y="521" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">  Active BigFET Rail Clamp -&gt; VSSA! (Never rely on D_P without</text>
  <text x="48" y="537" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">  a low-impedance VDDA-to-VSSA Rail Clamp!)</text>
  <rect x="693" y="114" width="352" height="146" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="696" y1="120" x2="696" y2="254" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="705" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#b91c1c" text-anchor="start" font-weight="bold">1. Bondwire L·di/dt Ground Bounce (§19.5)</text>
  <text x="705" y="149" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Gold/Cu wirebond adds L_bond ≈ 1 nH/mm (2–5 nH/pin).</text>
  <text x="705" y="165" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Digital I/O switching ΔI = 100 mA in Δt = 100 ps induces</text>
  <text x="705" y="181" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  ΔV_bounce = L · ΔI/Δt = 2 nH · 10⁹ A/s = 2.0 V !!</text>
  <text x="705" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Never share analog ground wirebond with digital drivers!</text>
  <text x="705" y="213" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  Use multiple parallel ground pins (L_eff = L / N) + Kelvin sense.</text>
  <rect x="693" y="276" width="352" height="138" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="696" y1="282" x2="696" y2="408" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="705" y="294" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#1d4ed8" text-anchor="start" font-weight="bold">2. Analog RF/High-Speed C_ESD Trade-Off</text>
  <text x="705" y="311" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Large ESD diodes add C_ESD ~ 0.3–1.5 pF + nonlinear C(V)</text>
  <text x="705" y="327" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  directly at the pin, degrading S11, TIA BW, and HD2/HD3!</text>
  <text x="705" y="343" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Mitigation: T-coil inductive neutralization, smaller diodes</text>
  <text x="705" y="359" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  with faster rail clamp, &amp; symmetric DP = DN C(V) cancellation.</text>
  <rect x="693" y="430" width="352" height="130" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="696" y1="436" x2="696" y2="554" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="705" y="448" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#047857" text-anchor="start" font-weight="bold">3. Mandatory Double Guard-Ring Rule</text>
  <text x="705" y="465" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• ESD diodes inject massive minority carriers into substrate</text>
  <text x="705" y="481" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  during stress -&gt; prime Latch-Up trigger!</text>
  <text x="705" y="497" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Surround every I/O ESD cell with dedicated P+ &amp; N+ guard</text>
  <text x="705" y="513" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  rings spaced ≥ 15–20 µm from sensitive analog cores.</text>
</svg>
