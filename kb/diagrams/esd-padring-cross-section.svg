  <rect x="505" y="198" width="118" height="156" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="564" y="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#d97706" text-anchor="middle" font-weight="bold">RC-Triggered</text>
  <text x="564" y="242" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#d97706" text-anchor="middle" font-weight="bold">BigFET Clamp</text>
  <text x="564" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="middle">τ_RC ~ 1 µs:</text>
  <text x="564" y="282" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="bold">ON for ns ESD</text>
  <text x="564" y="298" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#059669" text-anchor="middle" font-weight="bold">OFF in DC op!</text>
  <line x1="564" y1="132" x2="564" y2="198" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="564" y1="354" x2="564" y2="425" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
