  <line x1="862" y1="210" x2="749" y2="210" stroke="#dc2626" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arr-warn)"/>
  <text x="804" y="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#dc2626" text-anchor="middle" font-weight="bold">-Gm,c (Cross-Inverted!)</text>
  <rect x="582" y="266" width="445" height="118" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="804" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.4" fill="#d97706" text-anchor="middle" font-weight="bold">Hybrid Nanometer Frequency Tuning (Lowers KVCO AM-PM Noise!)</text>
  <text x="804" y="314" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="middle">• Coarse Digital Band Select: Binary-weighted MIM/MOM Cap Bank + NMOS switches</text>
  <text x="804" y="334" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#475569" text-anchor="middle">  (Trade-off: Switch Ron lowers Q_cap = 1/(ω·C·Ron) vs Off-state Coff tuning range).</text>
  <text x="804" y="356" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="middle">• Fine Continuous Analog Lock: Accumulation-Mode MOS Varactor driven by Vctrl</text>
  <text x="804" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#059669" text-anchor="middle" font-weight="bold">  with small KVCO (MHz/V) so loop-filter thermal/ripple voltage causes minimal jitter!</text>
  <rect x="566" y="402" width="476" height="160" rx="7" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <line x1="569" y1="408" x2="569" y2="556" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
  <text x="578" y="420" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#6d28d9" text-anchor="start" font-weight="bold">Leeson / Hajimiri Phase-Noise Regimes (§15.7)</text>
  <text x="578" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• 1/f³ Close-In Corner: Device 1/f flicker noise up-converted via</text>
  <text x="578" y="453" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  waveform asymmetry (DC component c0 of ISF) &amp; AM-to-PM varactor!</text>
  <text x="578" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• 1/f² Thermal Skirt: Tank loss + active Gm thermal noise ÷ V_swing²·Q²!</text>
  <text x="578" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Tail 2·ω0 Noise Trap: Tail current thermal noise around 2·f0 mixes</text>
  <text x="578" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  down into ±Δf phase noise! Fix: LC tail noise filter at 2·f0.</text>
