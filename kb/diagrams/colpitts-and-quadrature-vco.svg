  <text x="48" y="452" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#1d4ed8" text-anchor="start" font-weight="bold">Colpitts Startup &amp; Cyclostationary Phase-Noise Physics</text>
  <text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Resonance:  ω0 = 1 / √[ Lp · C1·C2 / (C1 + C2) ]</text>
  <text x="48" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Startup Condition:  gm · Rp ≥ (C1 + C2)² / (C1 · C2) ≥ 4  (at C1=C2)!</text>
  <text x="48" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  (Harder startup than cross-coupled LC gm·Rp ≥ 1!)</text>
  <text x="48" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• ISF Advantage: M1 conducts narrow Class-C current pulses right at</text>
  <text x="48" y="533" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  tank voltage extremum where Impulse Sensitivity Γ(φ) ≈ 0 -&gt; low L(Δf)!</text>
  <rect x="582" y="142" width="165" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="664" y="178" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">LC-VCO Core I</text>
  <text x="664" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="middle">Outputs: I+, I- (0°/180°)</text>
  <text x="664" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">gm,core + Gm,couple</text>
  <rect x="862" y="142" width="165" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
