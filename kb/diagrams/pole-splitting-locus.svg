  <text x="580" y="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.1" fill="#047857" text-anchor="start" font-weight="bold">Exact Nulling Resistor Tuning Law (Eq. 10.38–10.41)</text>
  <text x="580" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• s_zero = +1 / [Cc · (1/gm6 − Rz)]</text>
  <text x="580" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Rz = 1 / gm6              -&gt; Moves RHP zero to ∞</text>
  <text x="580" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Rz = (CL + Cc)/(gm6·Cc)   -&gt; Places LHP zero right on ωp2'!</text>
  <text x="580" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Implement Rz with triode MOSFET biased by replica diode M!</text>
