  <text x="48" y="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.1" fill="#1d4ed8" text-anchor="start" font-weight="bold">Why ωp2 Moves UP Physically (§10.5.2)</text>
  <text x="48" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• At high ω, Miller Cc shorts Gate and Drain of M6!</text>
  <text x="48" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• M6 becomes DIODE-CONNECTED -&gt; output impedance drops</text>
  <text x="48" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  from R2 = ro6||ro7 down to 1/gm6 -&gt; ωp2' ≈ gm6 / CL!</text>
  <text x="48" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Phase Margin ≥ 60° requires ωp2' ≥ √3·GBW (~2.2x with zeros).</text>
