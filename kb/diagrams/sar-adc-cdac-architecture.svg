  <rect x="638" y="354" width="406" height="206" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="641" y1="360" x2="641" y2="554" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="650" y="372" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#b45309" text-anchor="start" font-weight="bold">Modern Low-Energy C-DAC Switching Schemes</text>
  <text x="650" y="389" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Conventional Trial-and-Error: Wastes huge energy discharging</text>
  <text x="650" y="405" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  MSB cap back down when trial bit = 0 (E_avg ≈ 1363·C·Vref² @ 10b).</text>
  <text x="650" y="421" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Vcm-Based Merged Capacitor Switching (MCS): Resets bottom</text>
  <text x="650" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  plates to Vcm first -&gt; cuts total C_tot by 2x &amp; energy by ~87%!</text>
  <text x="650" y="453" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Monotonic Set-and-Down (Liu): Samples directly on top plates</text>
  <text x="650" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  and only switches one side down -&gt; 81% less energy + faster,</text>
  <text x="650" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  at the cost of Vcm shifting toward GND (watch comparator VOS!).</text>
