  <text x="48" y="452" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#1d4ed8" text-anchor="start" font-weight="bold">3-Source SAR ADC Precision &amp; Noise Budget</text>
  <text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">1. Sampling kT/C + Comparator Thermal Noise:  Vn,tot² = kT/C_tot + Vn,comp² &lt; Δ²/12</text>
  <text x="48" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   where LSB step Δ = V_FS / 2^N  (10-bit 1Vpp -&gt; Δ ≈ 1 mV; 12-bit -&gt; Δ ≈ 244 µV!).</text>
  <text x="48" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">2. C-DAC Pelgrom Capacitor Mismatch (σ_ΔC/C = A_C / √(W·L)): Sets INL / DNL / SFDR!</text>
  <text x="48" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">3. Reference Settling: Vref buffer must settle CDAC MSB current spike within T_bit!</text>
