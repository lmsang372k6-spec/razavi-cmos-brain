  <text x="572" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="bold">Two-Step Procedure &amp; Why In,in² Matters (§7.3)</text>
  <text x="572" y="391" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">1. Short input (ZS = 0): Measure Vn,out² -&gt; Vn,in² = Vn,out² / |Av0|²</text>
  <text x="572" y="407" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">2. Open input  (ZS = ∞): Measure Vn,out² -&gt; In,in² = Vn,out² / |Ztrans|²</text>
  <text x="572" y="439" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• For finite source impedance ZS (assuming low correlation):</text>
  <text x="572" y="455" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  Vn,tot,in² ≈ Vn,in² + |ZS|² · In,in² + 4kT·Re(ZS)</text>
  <text x="572" y="471" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Low-f MOSFET gate: In,in² ≈ 0, UNLESS ω·Cgs·|ZS| is significant!</text>
  <text x="572" y="487" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• 1-Pole Noise Bandwidth:  BWn = (π / 2) · f-3dB ≈ 1.57 · f-3dB</text>
