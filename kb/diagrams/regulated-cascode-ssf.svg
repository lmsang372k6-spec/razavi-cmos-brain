  <text x="578" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Effective cascode transconductance becomes (1 + Aaux)·gm2:</text>
  <text x="578" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  Rout,RGC ≈ (1 + Aaux) · gm2 · ro2 · ro1   ~ O((gm·ro)³) !</text>
  <text x="578" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Stability Window:  ω_p,out &lt; ω_u,aux &lt; ω_p2 (avoid doublet!).</text>
