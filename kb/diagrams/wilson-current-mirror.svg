  <text x="588" y="373" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Headroom:  Vout,min = VTH + 2·Vov    |    Impedance:  Rout ≈ gm·ro²/2</text>
  <text x="588" y="389" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Verdict:   Asymmetric noise/poles + 2VGS in!</text>
