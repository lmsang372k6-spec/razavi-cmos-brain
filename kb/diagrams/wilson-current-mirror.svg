  <text x="48" y="459" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Any pull on Iout raises VD2 -&gt; raises VG1 -&gt; M1 pulls down VG3 -&gt;</text>
  <text x="48" y="475" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  M3 opposes ΔIout!  Rout ≈ gm3 · ro3 · ro1 / 2.</text>
  <text x="48" y="491" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Diode M4 equalizes VD1 = VD2 = VGS2 -&gt; zero systematic CLM error!</text>
  <text x="48" y="507" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Fatal Low-VDD Cost: Input branch demands 2·VGS = 2·VTH + 2·Vov,</text>
  <text x="48" y="523" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  and output branch still loses VGS2 + VDS3,min = VTH + 2·Vov !</text>
