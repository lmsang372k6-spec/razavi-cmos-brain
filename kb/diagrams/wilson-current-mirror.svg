  <text x="588" y="483" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Headroom:  Vout,min = 2·VDS,min !    |    Impedance:  Rout ≈ gm·ro²</text>
  <text x="588" y="499" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Verdict:   Best for ≤1.2V CMOS (Vb=VTH+2Vov)!</text>
