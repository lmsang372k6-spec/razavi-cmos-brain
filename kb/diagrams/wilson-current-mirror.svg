  <text x="588" y="263" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Headroom:  Vout,min = VTH + 2·Vov    |    Impedance:  Rout ≈ gm·ro²</text>
  <text x="588" y="279" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Verdict:   Wastes 1 VTH at output!</text>
