  <text x="84" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb" text-anchor="start">Signal Path: id1 = gm1·Vin flows ~100% through M2 to Vout</text>
  <rect x="528" y="76" width="488" height="162" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="531" y1="82" x2="531" y2="232" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="540" y="94" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.4" fill="#b45309" text-anchor="start" font-weight="bold">1. Physical Shielding Mechanism (Razavi §3.6)</text>
  <text x="540" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• M2 acts as a Common-Gate current buffer stacked atop M1.</text>
  <text x="540" y="127" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Looking up from Node X into Source of M2: Zin,s2 ≈ 1/(gm2 + gmb2)</text>
  <text x="540" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">  (when load is resistive; or Rout,load/(gm2*ro2) for high-Z load).</text>
  <text x="540" y="159" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Large output swing ΔVout is attenuated by ~(gm2 + gmb2)·ro2 at Node X,</text>
  <text x="540" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">  clamping VDS1 constant and suppressing M1 channel-length modulation!</text>
  <rect x="528" y="254" width="488" height="152" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="531" y1="260" x2="531" y2="400" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="540" y="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.4" fill="#1d4ed8" text-anchor="start" font-weight="bold">2. Exact &amp; Approximate Output Impedance</text>
  <text x="540" y="289" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Treating M1's ro1 as degeneration resistor RS of M2:</text>
  <text x="540" y="305" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">  Rout,dn = [1 + (gm2 + gmb2)·ro2]·ro1 + ro2</text>
  <text x="540" y="321" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">          ≈ (gm2 + gmb2)·ro2·ro1   ~  gm·ro²</text>
  <text x="540" y="337" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• With cascode PMOS load (Rout,up ~ gm·ro²):</text>
  <text x="540" y="353" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">  Intrinsic Voltage Gain: |Av| = Gm·Rout ≈ (1/2)·(gm·ro)²</text>
  <rect x="528" y="422" width="488" height="136" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="531" y1="428" x2="531" y2="552" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="540" y="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.4" fill="#047857" text-anchor="start" font-weight="bold">3. High-Frequency &amp; Noise Bonus (Ch.06 &amp; Ch.07)</text>
  <text x="540" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Eliminates Miller Effect on M1: Av(G1 -&gt; X) ≈ −gm1 / gm2 ≈ −1,</text>
  <text x="540" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">  so Cgd1 is multiplied by only ~2x instead of (1 + gm1·Rout)!</text>
  <text x="540" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Low-Freq Noise of M2 is negligible: M2's thermal noise circulates</text>
  <text x="540" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">  locally because ro1 degenerates M2's source by gm2·ro1 &gt;&gt; 1.</text>
</svg>
