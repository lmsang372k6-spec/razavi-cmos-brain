  <text x="612" y="419" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Positive loop gain &gt; 1 near origin pushes circuit away from</text>
  <text x="612" y="435" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  small perturbations ONLY once VGS &gt; VTH; at VGS = 0, loop gain = 0</text>
  <text x="612" y="451" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  so (I1=0, I2=0) is a stable dead zone!</text>
  <text x="612" y="467" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Mandatory Verification (Spectre):</text>
  <text x="612" y="483" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  1) Slow &amp; fast VDD ramp tran (1 ns and 10 ms) at SS, -40°C!</text>
  <text x="612" y="499" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  2) Sweep starter node voltage to prove single intersection!</text>
