  <text x="48" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• KVL on M1–M2–RS:  VGS1 = VGS2 + I2·RS  with I1 = I2 = Iref :</text>
  <text x="48" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  Iref = [2 / (μn·Cox·(W/L)1 · RS²)] · (1 - 1/√K)²</text>
  <text x="48" y="511" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  =&gt;  gm1 = 2 · (1 - 1/√K) / RS    (for K=4:  gm1 = 1 / RS !)</text>
  <text x="48" y="527" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Add Cascode shields on M1–M4 to prevent VDD drift via λ (CLM)!</text>
