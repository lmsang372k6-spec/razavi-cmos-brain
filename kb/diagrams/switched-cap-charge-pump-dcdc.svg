  <rect x="36" y="314" width="494" height="106" rx="7" fill="#f8fafc" stroke="#059669" stroke-width="1.6"/>
  <text x="283" y="336" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold">N-Stage Dickson Pump &amp; Cross-Coupled Latch Doubler</text>
  <text x="283" y="356" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="middle">• Classic Diode Dickson:  Vout = (N + 1)·Vin − N·V_TH  (severe body-effect V_TH loss!)</text>
  <text x="283" y="375" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#2563eb" text-anchor="middle" font-weight="bold">• Cross-Coupled NMOS/PMOS Charge-Transfer Switches: Zero V_TH drop (full N+1 gain!).</text>
  <text x="283" y="394" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#475569" text-anchor="middle">• Multi-Phase Interleaving (K = 4..16 phases): Cancels input/output ΔV_ripple without Cout!</text>
  <rect x="36" y="434" width="494" height="152" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="39" y1="440" x2="39" y2="580" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#1d4ed8" text-anchor="start" font-weight="bold">Inherent Ratio Efficiency Law &amp; Multi-Gearbox SC</text>
  <text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Ideal Charge Conservation forces I_in = M · I_out  =&gt;</text>
  <text x="48" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  η_max = Vout / (M · Vin)   (even if R_out -&gt; 0, voltage drop burns power!).</text>
  <text x="48" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Multi-Ratio Gearbox (M ∈ {2:1, 3:2, 4:3, 1:1}): Reconfigures flying</text>
  <text x="48" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  caps dynamically across Li-Ion discharge to sustain η = 86–93% on-die!</text>
  <text x="48" y="533" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Bottom-Plate Rule: Always tie C_bot plate to lower-dV/dt / driven node!</text>
  <line x1="622" y1="352" x2="1052" y2="352" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-dark)"/>
  <line x1="622" y1="352" x2="622" y2="126" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-dark)"/>
  <text x="1044" y="370" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#0f172a" text-anchor="end" font-weight="bold">log10(f_sw)</text>
  <text x="630" y="138" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="bold">log10(R_out)</text>
  <line x1="642" y1="152" x2="972" y2="338" stroke="#2563eb" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,4"/>
  <text x="685" y="162" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#2563eb" text-anchor="start" font-weight="bold">R_SSL = M_c / (C_fly·f_sw)</text>
  <line x1="642" y1="282" x2="1034" y2="282" stroke="#d97706" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,4"/>
  <text x="652" y="273" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#d97706" text-anchor="start" font-weight="bold">R_FSL = M_r · R_on (Switch Floor)</text>
  <path d="M 642 150 L 765 219 Q 848 268 935 279 L 1034 281" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="848" cy="260" r="5" fill="#059669" stroke="#ffffff" stroke-width="1.6"/>
  <line x1="848" y1="260" x2="848" y2="352" stroke="#059669" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3,3"/>
  <text x="848" y="368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#059669" text-anchor="middle" font-weight="bold">f_opt (R_SSL = R_FSL)</text>
  <path d="M 745 340 Q 895 312 1028 168" fill="none" stroke="#dc2626" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,3"/>
  <text x="1026" y="158" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#dc2626" text-anchor="end" font-weight="bold">P_bot + P_gate ∝ f_sw!</text>
  <rect x="582" y="390" width="482" height="196" rx="7" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <line x1="585" y1="396" x2="585" y2="580" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
  <text x="594" y="408" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#6d28d9" text-anchor="start" font-weight="bold">Seeman–Sanders SSL / FSL Equations &amp; Cap Choice</text>
  <text x="594" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Equivalent Thevenin Model:  Vout = M · Vin − I_load · R_out(f_sw)</text>
  <text x="594" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Euclidean Approximation:    R_out ≈ √( R_SSL² + R_FSL² )</text>
  <text x="594" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  - Slow-Switching Limit:  R_SSL = (∑ a_c,i²) / (C_fly · f_sw)</text>
  <text x="594" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  - Fast-Switching Limit:  R_FSL = 2 · ∑ a_r,k² · R_on,k</text>
  <text x="594" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Parasitic Loss Floor:    P_par = (α · C_fly · V_sw² + C_gg · V_G²) · f_sw</text>
  <text x="594" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  (MIM/MOM α ≈ 1–2% vs planar MOS cap α ≈ 8–15% -&gt; choose MIM + DNW!)</text>
</svg>
