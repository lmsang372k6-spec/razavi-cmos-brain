  <text x="272" y="514" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="bold">Negative Feedback Loop: ΔVX -&gt; −Aaux·ΔVX at Gate(M2)</text>
  <text x="272" y="535" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="middle">Equivalent to multiplying gm2 by (1 + Aaux)!</text>
  <rect x="544" y="76" width="474" height="158" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="547" y1="82" x2="547" y2="228" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="556" y="94" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.3" fill="#1d4ed8" text-anchor="start" font-weight="bold">1. Super-Cascode Output Impedance (§9.4.1)</text>
  <text x="556" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Local feedback holds VX tightly at Vb:</text>
  <text x="556" y="127" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  vgs2 = vg2 − vx = −Aaux·vx − vx = −(1 + Aaux)·vx</text>
  <text x="556" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Boosted Output Impedance:</text>
  <text x="556" y="159" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  Rout ≈ [1 + (1 + Aaux)·gm2·ro2]·ro1 + ro2</text>
  <text x="556" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">       ≈ (1 + Aaux) · gm2 · ro2 · ro1   ~  (gm·ro)³ !</text>
  <rect x="544" y="248" width="474" height="150" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="547" y1="254" x2="547" y2="392" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="556" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.3" fill="#b45309" text-anchor="start" font-weight="bold">2. Low-Voltage Input ICMR Constraint on Aaux</text>
  <text x="556" y="283" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• To preserve output swing, VX = Vb is set near VDS,min1</text>
  <text x="556" y="299" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  (~100–180 mV above GND in 65nm/45nm)!</text>
  <text x="556" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• An NMOS-input diff-pair in Aaux CANNOT operate at VX ≈ VDS,min!</text>
  <text x="556" y="331" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Solution: Use a PMOS-input Folded-Cascode or CS stage for Aaux.</text>
  <rect x="544" y="412" width="474" height="146" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="547" y1="418" x2="547" y2="552" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="556" y="430" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#b91c1c" text-anchor="start" font-weight="bold">3. Pole-Zero Doublet &amp; Stability Window (§9.4.2)</text>
  <text x="556" y="447" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#0f172a" text-anchor="start">• Auxiliary loop creates a closed-loop pole-zero doublet!</text>
  <text x="556" y="463" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#0f172a" text-anchor="start">• Safe Bandwidth Window (Bult &amp; Geelen / Razavi):</text>
  <text x="556" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#0f172a" text-anchor="start">    β · ωu,main  &lt;  ωu,aux  &lt;  ωp2,main (fold/cascode pole)</text>
  <text x="556" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#0f172a" text-anchor="start">• Too slow ωu,aux -&gt; slow settling doublet; too fast -&gt; rings!</text>
</svg>
