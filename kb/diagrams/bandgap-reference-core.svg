  <text x="658" y="401" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Ideal Output:</text>
  <text x="658" y="417" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  VREF = VBE2 + (1 + R2/R3)·VT·ln(n) = VBE1 + (R2/R3)·VT·ln(n)</text>
  <text x="658" y="433" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• FATAL OP-AMP OFFSET TRAP:</text>
  <text x="658" y="449" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  VREF ≈ VBE1 + (R2/R3)·VT·ln(n) − (1 + R2/R3)·VOS !</text>
  <text x="658" y="465" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  - Non-PTAT VOS gets multiplied by ~8–12x, corrupting</text>
  <text x="658" y="481" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">    BOTH absolute accuracy AND temperature coefficient!</text>
  <text x="658" y="497" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  - Mitigation: Large n (e.g., n=8 or 24), series 2-diode</text>
  <text x="658" y="513" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">    stack, large input pair WL, or chopper/auto-zero A1.</text>
