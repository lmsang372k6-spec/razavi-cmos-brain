  <text x="1036" y="198" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#059669" text-anchor="end" font-weight="bold">+ Quad-Switch / RZ!</text>
  <rect x="600" y="396" width="464" height="190" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="603" y1="402" x2="603" y2="580" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="612" y="414" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#1d4ed8" text-anchor="start" font-weight="bold">Why Finite Z_unit(f) Limits High-Speed RF DAC SFDR</text>
  <text x="612" y="431" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• At RF frequencies, parasitic C_tail at M_CAS source shunts M_CS ro:</text>
  <text x="612" y="447" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">    Z_unit(f) ≈ gm,cas · ro,cas / (j · 2π·f_out · C_tail)   (−20 dB/dec!)</text>
  <text x="612" y="463" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• Code-Dependent Load Modulation (k ON cells in parallel with R_L):</text>
  <text x="612" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">    SFDR_HD2(f) ≈ 20 · log10[ 4 · |Z_unit(f)| / (2^N · R_L) ]</text>
  <text x="612" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">  Example: 12b DAC, R_L=50Ω, SFDR=70 dBc @ 500 MHz -&gt; |Z_unit| &gt; 160 MΩ!</text>
  <text x="612" y="511" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• Layout: Minimum-finger M_CAS drain/source diffusion + Q² Random-Walk MSB!</text>
</svg>
