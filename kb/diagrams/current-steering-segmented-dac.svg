  <text x="845" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold">Output Signal Frequency  log10(f_out)</text>
