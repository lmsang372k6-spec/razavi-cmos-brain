  <text x="48" y="484" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#047857" text-anchor="start" font-weight="bold">Pelgrom Static INL Yield &amp; Crossover Swing Rules</text>
  <text x="48" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• For &gt;99.7% INL &lt; 0.5 LSB yield across 2^N codes, size M_CS gate area WL so:</text>
  <text x="48" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">    σ(ΔI / I_u) = √[ A_β² + (4·A_VT² / V_ov²) ] / √(W·L)  ≤  1 / (6 · √(2^N))</text>
  <text x="48" y="533" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">  (Choose strong inversion V_ov = 0.25–0.40 V -&gt; gm/ID = 5..8 V⁻¹ on M_CS!)</text>
  <text x="48" y="549" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• Low-Crossover Gate Swing keeps V_tail from collapsing to AVDD at transitions!</text>
  <line x1="638" y1="348" x2="1060" y2="348" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-dark)"/>
  <line x1="638" y1="348" x2="638" y2="126" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-dark)"/>
