  <text x="386" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="bold">Middlebrook Exact Theorem (§8.7)</text>
  <text x="386" y="391" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Keeps closed-loop DC intact!</text>
  <text x="386" y="407" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Step 1: Inject series Vz -&gt; Tv = Vy/Vx</text>
  <text x="386" y="423" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Step 2: Inject shunt  Iz -&gt; Ti = Iy/Ix</text>
  <text x="386" y="439" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Exact Bilateral Loop Gain T(s):</text>
  <text x="386" y="455" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  T = (Tv · Ti − 1) / (Tv + Ti + 2)</text>
  <text x="386" y="471" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Blackman Impedance Formula (§8.8):</text>
  <text x="386" y="487" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  Zport = Z0 · (1 + T_sc) / (1 + T_oc)</text>
