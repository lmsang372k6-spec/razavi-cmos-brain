  <text x="276" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" fill="#0f172a" text-anchor="middle">D = −1 (Vin &lt; −Vr/4)  |  D = 0 (|Vin| ≤ Vr/4)  |  D = +1 (Vin &gt; +Vr/4)</text>
  <text x="276" y="401" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="bold">Drives C1 left plate in φ2 to D·Vref  =&gt;  V_res = 2·Vin − D·Vref</text>
