  <text x="608" y="463" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">  with zero missing codes after shift-and-add RSD reconstruction!</text>
  <text x="608" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">• Errors NOT Corrected by RSD (True Linearity Ceilings):</text>
  <text x="608" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">  1. C1 vs C2 Mismatch (ΔC/C): Alters slope 2 -&gt; step discontinuity (INL/DNL)!</text>
  <text x="608" y="511" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" fill="#0f172a" text-anchor="start">  2. Finite OTA Gain A0 &amp; Incomplete Settling -&gt; calibrate interstage gain!</text>
