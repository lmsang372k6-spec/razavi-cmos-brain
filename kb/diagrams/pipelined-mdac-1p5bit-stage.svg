  <text x="48" y="465" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Feedback Factor Boost: Flipping C2 onto V_res yields β = C / (2C + C_p) ≈ 0.5</text>
  <text x="48" y="481" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">  (vs β ≈ 0.33 in non-flip charge-redistribution) -&gt; 50% faster settling / lower I_D!</text>
  <text x="48" y="497" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Remaining K-bit Accuracy Specs on Stage-1 OTA:</text>
  <text x="48" y="513" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">    DC Gain:  A0 · β  &gt;  2^(K + 1)      |      Settling:  τ_cl &lt; T_φ2 / [(K + 1)·ln(2)]</text>
  <text x="48" y="529" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.7" fill="#0f172a" text-anchor="start">• Bottom-Plate Sampling: Open φ1e at VX slightly BEFORE φ1 input switches!</text>
