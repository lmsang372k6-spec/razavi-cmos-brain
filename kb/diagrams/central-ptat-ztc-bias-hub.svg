  <text x="183" y="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#d97706" text-anchor="middle" font-weight="bold">2. I_ZTC = I_PTAT + I_CTAT  (0 ppm/K)</text>
  <text x="183" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#0f172a" text-anchor="middle">Temperature-invariant current reference!</text>
  <text x="183" y="308" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" fill="#d97706" text-anchor="middle" font-weight="bold">-&gt; Route to Sawtooth Osc, DACs, Slew/Delays</text>
