  <text x="483" y="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#0f172a" text-anchor="middle">Immune to 30 mV ΔV_GND / ΔV_VDD IR Drop Across 4 mm Die!</text>
