  <text x="183" y="190" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#2563eb" text-anchor="middle" font-weight="bold">1. I_PTAT = ΔV_BE / R_1  (+0.33%/K)</text>
  <text x="183" y="208" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" fill="#0f172a" text-anchor="middle">Keeps gm = I_PTAT/(n·VT) CONSTANT!</text>
  <text x="183" y="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" fill="#059669" text-anchor="middle" font-weight="bold">-&gt; Route to OTAs, LNAs, Mixers, Gm-C</text>
