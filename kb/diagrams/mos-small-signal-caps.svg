  <text x="787" y="139" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Cgd ≈ W·Cov  (gate-drain ovlp)</text>
  <text x="787" y="155" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Cgb ≈ 0  (shielded by channel)</text>
  <text x="787" y="171" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Cdb = Cdb0 / (1 + VDB/φB)^mj</text>
  <text x="787" y="187" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Csb = Csb0 / (1 + VSB/φB)^mj</text>
  <text x="787" y="219" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">Triode: Cgs = Cgd ≈ (1/2)WLCox+WCov</text>
  <text x="787" y="235" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">Cutoff: Cgb ≈ WLCox || Cdep</text>
