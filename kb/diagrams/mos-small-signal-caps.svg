  <text x="787" y="365" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• gm = ∂ID/∂VGS = 2·ID / Vov</text>
  <text x="787" y="381" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">     = √(2·μn·Cox·(W/L)·ID)</text>
  <text x="787" y="397" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• gmb = η·gm  (η ≈ 0.1 - 0.25)</text>
  <text x="787" y="413" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Intrinsic Gain: Av0 = gm·ro</text>
  <text x="787" y="429" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">• Transit Freq (Unity Current Gain):</text>
  <text x="787" y="445" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="start">  fT ≈ gm / [2π·(Cgs + Cgd)]</text>
