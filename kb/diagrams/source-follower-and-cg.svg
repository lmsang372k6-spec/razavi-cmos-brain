  <text x="566" y="481" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Exact Input Z: Rin = (RD + ro1) / [1 + (gm1 + gmb1)·ro1]</text>
