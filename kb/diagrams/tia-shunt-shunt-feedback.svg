  <polyline points="353,132 405,132 405,195" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="36" y="422" width="508" height="138" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="39" y1="428" x2="39" y2="554" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="48" y="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="bold">Closed-Loop Port Equations (Current-Voltage Feedback)</text>
  <text x="48" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Closed-Loop Transimpedance:   ZT = Vout / Iin ≈ -RF · [A0 / (1 + A0)]</text>
  <text x="48" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Input Virtual-Ground Resistance:   Rin,closed = RF / (1 + A0)  (tiny!)</text>
  <text x="48" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Input -3 dB Bandwidth:   ω_-3dB ≈ (1 + A0) / [RF · (CPD + Cin)]</text>
  <text x="48" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  -&gt; Feedback compresses Rin by (1+A0), extending bandwidth (1+A0)x!</text>
  <rect x="600" y="114" width="442" height="146" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="603" y1="120" x2="603" y2="254" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="612" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="bold">1. The Gain-Noise Miracle of Shunt-Shunt TIA</text>
  <text x="612" y="149" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Open-loop resistor R_in requires SMALL R_in for wide bandwidth</text>
  <text x="612" y="165" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  1/(R_in·CPD), which destroys gain AND explodes thermal current</text>
  <text x="612" y="181" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  noise  In,R² = 4kT / R_in !</text>
  <text x="612" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Feedback TIA uses LARGE RF (high gain + LOW thermal noise</text>
  <text x="612" y="213" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  4kT/RF!), while A0 divides input resistance down to RF/(1+A0)!</text>
  <rect x="600" y="276" width="442" height="138" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="603" y1="282" x2="603" y2="408" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="612" y="294" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="bold">2. Two-Pole Peaking Trap from Large Photodiode CPD</text>
  <text x="612" y="311" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Loop gain T(s) has two poles: amplifier pole ω_p,amp and input</text>
  <text x="612" y="327" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  feedback pole ω_p,in = 1 / [RF · (CPD + Cin + CF)].</text>
  <text x="612" y="343" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Large CPD pushes ω_p,in below unity-loop-gain -&gt; severe ringing!</text>
  <text x="612" y="359" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Fix: Add small CF across RF creating LHP zero ω_z = 1/(RF·CF)!</text>
  <rect x="600" y="430" width="442" height="130" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="603" y1="436" x2="603" y2="554" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="612" y="448" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#b45309" text-anchor="start" font-weight="bold">3. Core Amplifier Noise (C_tot · ω Rising Term)</text>
  <text x="612" y="465" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Total input-referred current noise PSD:</text>
  <text x="612" y="481" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  In,in²(ω) = 4kT/RF + Vn,amp² · [1/RF² + ω²·(CPD + Cin)²]</text>
  <text x="612" y="497" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• At high frequency, ω²·CPD²·Vn,amp² dominates (f² noise)! Match Cin ≈ CPD!</text>
</svg>
