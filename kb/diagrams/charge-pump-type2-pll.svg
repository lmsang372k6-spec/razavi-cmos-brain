  <text x="32" y="444" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#b91c1c" text-anchor="start" font-weight="bold">1. Why Rp Zero is Mandatory!</text>
  <text x="32" y="461" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• CP + C1 is an integrator (1/s) AND VCO phase</text>
  <text x="32" y="477" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  is a 2nd integrator (KVCO/s) -&gt; H(s) ∝ 1/s²!</text>
  <text x="32" y="493" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Two poles at s=0 start at −180° phase -&gt;</text>
  <text x="32" y="509" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  OSCILLATES if Rp = 0!</text>
  <text x="32" y="525" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Series Rp adds LHP zero:  ωz = 1 / (Rp·C1).</text>
  <rect x="372" y="426" width="336" height="154" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="375" y1="432" x2="375" y2="574" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="384" y="444" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#b45309" text-anchor="start" font-weight="bold">2. Loop Dynamics &amp; Ripple Cap C2</text>
  <text x="384" y="461" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Natural Freq: ωn = √[ Ip·KVCO / (2π·N·C1) ]</text>
  <text x="384" y="477" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Damping:      ζ  = (Rp / 2) · √[ Ip·C1·KVCO / (2π·N) ]</text>
  <text x="384" y="493" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Shunt C2 suppresses ΔV = Ip·Rp step jumps on</text>
  <text x="384" y="509" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  Vctrl (choose C2 ≤ C1/10 so ωp3 &gt;&gt; ωu!).</text>
  <rect x="724" y="426" width="336" height="154" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="727" y1="432" x2="727" y2="574" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="736" y="444" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#1d4ed8" text-anchor="start" font-weight="bold">3. Noise Transfer Duality (§16.4)</text>
  <text x="736" y="461" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Ref / PFD / Charge-Pump / Divider Noise:</text>
  <text x="736" y="477" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  LOW-PASS filtered (× N² inside loop BW)!</text>
  <text x="736" y="493" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• VCO Phase Noise:</text>
  <text x="736" y="509" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  HIGH-PASS filtered (suppressed inside BW)!</text>
  <text x="736" y="525" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Trade-off sets optimal PLL loop bandwidth ωu.</text>
</svg>
