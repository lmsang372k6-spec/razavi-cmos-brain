  <text x="332" y="536" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="bold">Regulated Output:  VOUT = VREF · (1 + Rf1 / Rf2)   |   Dropout:  VDO = VDS,min(MP)</text>
  <text x="332" y="556" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle">PSRR Trap: ΔVIN couples via MP's ro,p AND Cgs,p unless VG tracks ΔVIN!</text>
  <rect x="662" y="76" width="398" height="168" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="665" y1="82" x2="665" y2="238" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="674" y="94" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="bold">1. Polarity &amp; Two-Pole Stability Hazard</text>
  <text x="674" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• PMOS MP is a Common-Source stage (inverting from VG to VOUT),</text>
  <text x="674" y="127" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  so feedback VFB MUST enter EA's (+) non-inverting terminal!</text>
  <text x="674" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Two Low-Frequency Poles fight for dominance:</text>
  <text x="674" y="159" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  - Output Pole: ωp,out = 1 / [(ro,p || RLOAD) · Cout]</text>
  <text x="674" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  - Gate Pole:   ωp,g   = 1 / [Rout,EA · (Cgs,p + (1+Av,p)Cgd,p)]</text>
  <rect x="662" y="258" width="398" height="160" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="665" y1="264" x2="665" y2="412" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="674" y="276" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="bold">2. Load-Dependent Pole Shift &amp; Compensation</text>
  <text x="674" y="293" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• As ILOAD varies from 10 μA -&gt; 100 mA, ro,p drops ~1000x -&gt;</text>
  <text x="674" y="309" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  ωp,out shifts across 3–4 DECADES! Worst PM vary by LDO type:</text>
  <text x="674" y="325" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  - Off-chip μF Cout (ωp,out dominant): Stabilize via RESR</text>
  <text x="674" y="341" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">    LHP zero ωz,ESR = 1 / (RESR · Cout) (watchlight-load!).</text>
  <text x="674" y="357" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  - Capless on-chip LDO: Use Ahuja/Miller + buffer on VG!</text>
  <rect x="662" y="432" width="398" height="146" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="665" y1="438" x2="665" y2="572" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="674" y="450" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="bold">3. Transient Droop &amp; PSRR Across Frequency</text>
  <text x="674" y="467" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Load-Step Undershoot:  ΔVdroop ≈ (ΔILOAD · tresp) / Cout</text>
  <text x="674" y="483" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  + ΔILOAD · RESR  (tresp ≈ 1 / BWloop + slew delay at Cg!).</text>
  <text x="674" y="499" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• High-freq PSRR degrades at ωu,loop where Cout impedance</text>
  <text x="674" y="515" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  takes over from active EA loop gain.</text>
</svg>
