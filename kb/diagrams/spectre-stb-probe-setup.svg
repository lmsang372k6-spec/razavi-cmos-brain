  <text x="580" y="431" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">1. Differential Mode (`diffstbprobe` with `mode=diff`):</text>
  <text x="580" y="447" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   Verifies main signal feedback loop T_DM(jω), GBW_DM, and PM_DM ≥ 60°.</text>
  <text x="580" y="463" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">2. Common-Mode Feedback Loop (`IPRB_CMFB` or `mode=comm`):</text>
  <text x="580" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   CMFB shares OTA output pole CL AND adds CM detector pole!</text>
  <text x="580" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   A ringing or unstable CMFB rail clips Out± even if T_DM looks perfect!</text>
  <text x="580" y="511" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">   Rule: Verify PM_CMFB ≥ 55° &amp; GBW_CMFB ≈ (0.3 .. 1.0) · GBW_DM!</text>
