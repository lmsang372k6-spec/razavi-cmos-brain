  <text x="48" y="414" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#1d4ed8" text-anchor="start" font-weight="bold">Why Spectre `stb` Beats Classic Big-L / Big-C AC Breaks</text>
  <text x="48" y="431" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Never break DC bias with 1 GH / 1 GF ideal components (causes</text>
  <text x="48" y="447" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  floating DC convergence error or alters exact bidirectional Z loading!).</text>
  <text x="48" y="463" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• `stb` keeps loop 100% CLOSED during DC OpPoint, then evaluates exact</text>
  <text x="48" y="479" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  Middlebrook voltage+current return ratio T(jω) at `probe=IPRB0`!</text>
  <text x="48" y="495" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Netlist:  `stb stb start=1 stop=100G dec=30 probe=IPRB0`</text>
  <text x="48" y="511" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  Check: Phase Margin PM ≥ 60° &amp; Gain Margin GM ≥ 10 dB across PVT!</text>
