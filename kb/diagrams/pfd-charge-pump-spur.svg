  <text x="624" y="362" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#b91c1c" text-anchor="start" font-weight="bold">Quantitative Reference Spur Physics &amp; Fixes (§16.2)</text>
  <text x="624" y="379" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• In steady-state lock, if I_UP ≠ I_DN, PFD shifts static phase Δφ_ss</text>
  <text x="624" y="395" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  so net charge over T_ref is zero:  I_UP·t_UP = I_DN·t_DN.</text>
  <text x="624" y="411" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• During every reset pulse τ_rst, ΔI = I_UP - I_DN injects periodic</text>
  <text x="624" y="427" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  ripple ΔV_ctrl(f_ref) into KVCO, creating FM sidebands at f0 ± f_ref:</text>
  <text x="624" y="443" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  P_spur ≈ 20·log10[ (KVCO · ΔV_ripple) / (2 · ω_ref) ] !</text>
  <text x="624" y="459" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">• Fixes: Replica unity-gain op-amp biasing V_ctrl = V_replica to match</text>
  <text x="624" y="475" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.1" fill="#0f172a" text-anchor="start">  I_UP = I_DN across V_ctrl range + dummy charge-cancellation switches!</text>
