  <text x="48" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#1d4ed8" text-anchor="start" font-weight="bold">Dead-Zone Elimination vs 3rd-Order Loop Filter Synthesis</text>
  <text x="48" y="421" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Dead-Zone Fix: Without reset delay τ_rst (~150–300 ps), ultra-narrow</text>
  <text x="48" y="437" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  UP/DN pulses near Δφ = 0 fail to turn ON CP switches -&gt; VCO wanders freely!</text>
  <text x="48" y="453" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Stabilizing Zero &amp; Ripple Pole:</text>
  <text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  ω_z = 1 / (RP · C1)   stabilizes Type-II double integrator (2 poles at s=0);</text>
  <text x="48" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  ω_p3 ≈ 1 / (RP · C2)  suppresses RP·I_CP voltage jumps (keep C2 ≤ C1/10)!</text>
