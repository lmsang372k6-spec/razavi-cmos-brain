  <text x="42" y="544" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#2563eb" text-anchor="start">Total short-circuit Gm = gm1/2 (mirror) + gm2/2 (direct) = gm1 !</text>
  <rect x="586" y="76" width="432" height="162" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="589" y1="82" x2="589" y2="232" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="598" y="94" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.3" fill="#1d4ed8" text-anchor="start" font-weight="bold">1. Small-Signal Gain &amp; Output Impedance (§5.3.2)</text>
  <text x="598" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• By inspection (valid since RSS = ro5 &gt;&gt; 1/gm3):</text>
  <text x="598" y="127" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  Gm = gm1 ,   Rout ≈ ro2 || ro4</text>
  <text x="598" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  Adm = Vout / (Vin+ − Vin−) ≈ gm1 · (ro2 || ro4)</text>
  <text x="598" y="159" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Achieves FULL gm1·(ro2||ro4) differential-to-single-ended</text>
  <text x="598" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  gain without wasting half the signal current!</text>
  <rect x="586" y="252" width="432" height="150" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="589" y1="258" x2="589" y2="396" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="598" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.3" fill="#b45309" text-anchor="start" font-weight="bold">2. ICMR, Output Swing &amp; Asymmetric Clipping</text>
  <text x="598" y="287" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Output Swing: VCM_in − VTH1 ≤ Vout ≤ VDD − |VDS,min4|</text>
  <text x="598" y="303" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  (Limited by M2 entering triode if Vout drops too low!)</text>
  <text x="598" y="319" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• ICMR: VGS1 + VDS,min5 ≤ Vin,CM ≤ VDD − |VGS3| + VTH1</text>
  <text x="598" y="335" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Asymmetry: Node X sits at VDD−|VGS3|; Vout can swing wider.</text>
  <rect x="586" y="416" width="432" height="142" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="589" y1="422" x2="589" y2="552" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="598" y="434" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.3" fill="#b91c1c" text-anchor="start" font-weight="bold">3. CMRR &amp; Noise Design Rules (Ch.05 &amp; Ch.07)</text>
  <text x="598" y="451" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Finite ro5 + mirror impedance asymmetry degrades CMRR:</text>
  <text x="598" y="467" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  CMRR ≈ 2 · gm1 · ro5 · (gm3 · (ro1 || ro3))</text>
  <text x="598" y="483" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">• Noise: M3 &amp; M4 inject thermal &amp; 1/f noise directly:</text>
  <text x="598" y="499" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.7" fill="#0f172a" text-anchor="start">  Vn,in² = 8kTγ·(1/gm1 + gm3/gm1²) -&gt; Make gm3 &lt;&lt; gm1!</text>
</svg>
