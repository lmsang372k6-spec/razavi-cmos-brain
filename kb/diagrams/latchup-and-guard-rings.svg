  <text x="342" y="535" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#dc2626" text-anchor="middle" font-weight="bold">Positive-Feedback SCR Loop:  I_C1 feeds Base(Q2) via Rsub ; I_C2 feeds Base(Q1) via Rwell!</text>
  <text x="342" y="555" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#059669" text-anchor="middle" font-weight="bold">N+ / P+ Guard Rings (Green) intercept minority carriers &amp; clamp Rwell, Rsub -&gt; 0!</text>
  <rect x="682" y="76" width="378" height="166" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="685" y1="82" x2="685" y2="236" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="694" y="94" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="bold">1. Physical Latch-Up Mechanism (§18.8)</text>
  <text x="694" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Every bulk CMOS pair forms a 4-layer P+ / N-well /</text>
  <text x="694" y="127" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  P-sub / N+ Silicon-Controlled Rectifier (SCR)!</text>
  <text x="694" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• ESD/I/O overshoot or substrate bounce injects current</text>
  <text x="694" y="159" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  through Rsub or Rwell: once I·R ≥ 0.7 V turns ON Q1/Q2</text>
  <text x="694" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  with loop gain β1·β2 ≥ 1, VDD shorts to GND until</text>
  <text x="694" y="191" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  power is cycled (or metal melts)!</text>
  <rect x="682" y="256" width="378" height="162" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="685" y1="262" x2="685" y2="412" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="694" y="274" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="bold">2. Mandatory Layout Prevention Rules</text>
  <text x="694" y="291" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">1. Place dense N+ well taps (to VDD) &amp; P+ substrate</text>
  <text x="694" y="307" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">   taps (to VSS) throughout all analog blocks -&gt; Rwell, Rsub ↓.</text>
  <text x="694" y="323" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">2. Surround noisy digital, I/O ESD, &amp; large switches</text>
  <text x="694" y="339" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">   with continuous double Guard Rings (P+ in P-sub,</text>
  <text x="694" y="355" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">   N+ in N-well) to collect injected minority carriers!</text>
  <rect x="682" y="432" width="378" height="146" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="685" y1="438" x2="685" y2="572" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="694" y="450" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="bold">3. Deep N-Well (Triple-Well) Isolation</text>
  <text x="694" y="467" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• In 90nm/65nm/45nm RF &amp; mixed-signal PDKs, placing</text>
  <text x="694" y="483" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  sensitive NMOS inside an isolated P-well within a</text>
  <text x="694" y="499" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  VDD-biased Deep N-Well shields substrate noise AND</text>
  <text x="694" y="515" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  eliminates body effect (tie local P-well to Source)!</text>
</svg>
