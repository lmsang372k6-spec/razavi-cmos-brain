  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0f172a"/></marker>
    <marker id="arr-sig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#2563eb"/></marker>
    <marker id="arr-bias" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#dc2626"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#d97706"/></marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#7c3aed"/></marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#475569"/></marker>
  </defs>
  <rect x="2" y="2" width="1076" height="596" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 12 2 L 1068 2 Q 1078 2 1078 12 L 1078 58 L 2 58 L 2 12 Q 2 2 12 2 Z" fill="#f8fafc"/>
  <line x1="2" y1="58" x2="1078" y2="58" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="18" y="11" width="130" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="83" y="26" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="bold">EDA · PSS/PNoise</text>
  <text x="158" y="26.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">Spectre Periodic RF &amp; Mixed-Signal Verification Flow (PSS -&gt; PAC / PNoise / PSTB)</text>
  <text x="20" y="48" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="start">Quy trình Mô phỏng Tuần hoàn Spectre RF / Mixed-Signal cho Mạch SC, Comparator, VCO &amp; PLL (Layer 8)</text>
  <rect x="18" y="74" width="1044" height="232" rx="8" fill="#fcfdff" stroke="#e2e8f0" stroke-width="1.3"/>
  <rect x="18" y="74" width="1044" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="92.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">(a) Why Standard DC + AC/Noise Fails on Clocked / Autonomous Circuits &amp; 4-Engine Flow</text>
  <rect x="18" y="322" width="1044" height="256" rx="8" fill="#fcfdff" stroke="#e2e8f0" stroke-width="1.3"/>
  <rect x="18" y="322" width="1044" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="340.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="bold">(b) Exact Use-Case Matrix: Switched-Capacitor vs Dynamic Comparator vs VCO / CP-PLL</text>
  <rect x="42" y="124" width="256" height="156" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="170" y="149" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">1. Periodic Steady State (pss)</text>
  <text x="170" y="171" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="middle">Computes exact time-varying</text>
  <text x="170" y="188" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="middle" font-weight="bold">periodic trajectory x_0(t) = x_0(t+T0)!</text>
  <text x="170" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• Shooting Engine: SC / Comp / Ring</text>
  <text x="170" y="229" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• Harmonic Balance: High-Q LC-VCO</text>
  <text x="170" y="248" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="bold">• Set `tstab` until steady limit cycle!</text>
  <polyline points="298,202 332,202 332,140 363,140" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-dark)"/>
  <rect x="365" y="114" width="326" height="52" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.9"/>
  <text x="379" y="135" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#059669" text-anchor="start" font-weight="bold">2A. PAC / PXF (Periodic AC / XF)</text>
  <text x="379" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">Gain H(z), Aliasing Sidebands &amp; Clocked PSRR</text>
  <polyline points="298,202 332,202 332,204 363,204" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-dark)"/>
  <rect x="365" y="178" width="326" height="52" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.9"/>
  <text x="379" y="199" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#dc2626" text-anchor="start" font-weight="bold">2B. PNoise (Sampled &amp; Phase Noise)</text>
  <text x="379" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">SC kT/C Folding, Jitter &amp; VCO 1/f³ + 1/f² L(Δf)</text>
  <polyline points="298,202 332,202 332,268 363,268" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-dark)"/>
  <rect x="365" y="242" width="326" height="52" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.9"/>
  <text x="379" y="263" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#d97706" text-anchor="start" font-weight="bold">2C. PSTB (Periodic Loop Stability)</text>
  <text x="379" y="282" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">Time-averaged loop gain T(jω) of SC-CMFB!</text>
  <rect x="722" y="116" width="318" height="174" rx="7" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <line x1="725" y1="122" x2="725" y2="284" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
  <text x="734" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.6" fill="#6d28d9" text-anchor="start" font-weight="bold">Critical Spectre Parameter Rules</text>
  <text x="734" y="151" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">• `beat` / `fund`: GCD of all autonomous</text>
  <text x="734" y="167" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">  or driven clock frequencies!</text>
  <text x="734" y="183" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">• `maxacfreq` / `maxsideband &gt;= 15..40`:</text>
  <text x="734" y="199" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">  Too few sidebands misses wideband thermal</text>
  <text x="734" y="215" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">  noise folding across f_clk harmonics!</text>
  <text x="734" y="231" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">• `errpreset=conservative` mandatory</text>
  <text x="734" y="247" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start">  for &lt; -120 dBc/Hz VCO phase noise!</text>
  <rect x="38" y="358" width="322" height="202" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="41" y1="364" x2="41" y2="554" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="50" y="376" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1d4ed8" text-anchor="start" font-weight="bold">Switched-Capacitor (SC Integrator / Amp)</text>
  <text x="50" y="393" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• Driven PSS: `fund = f_clk`, `harms = 0`</text>
  <text x="50" y="409" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  (Shooting engine handles sharp switches!).</text>
  <text x="50" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• PAC: Sweep 1 Hz .. f_clk/2, `maxsideband=20`</text>
  <text x="50" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  -&gt; read sampled discrete-time gain |H(e^jω)|.</text>
  <text x="50" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• PNoise (`sampled` / `timedomain` at end of</text>
  <text x="50" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  φ2 hold window): Captures exact kT/C + OTA</text>
  <text x="50" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  folded white &amp; 1/f noise!</text>
  <rect x="380" y="358" width="322" height="202" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="383" y1="364" x2="383" y2="554" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="392" y="376" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="bold">StrongARM Comparator Input Noise</text>
  <text x="392" y="393" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• Driven PSS at `f_clk` with small DC overdrive</text>
  <text x="392" y="409" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  ΔVin near switching threshold (e.g. 0.5 mV).</text>
  <text x="392" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• PNoise (`sampled` jitter/voltage at regeneration</text>
  <text x="392" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  crossing) + PAC conversion gain A_conv:</text>
  <text x="392" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  σ_Vn,in = V_n,out(strobe) / A_conv !</text>
  <text x="392" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• Transient Noise (`trannoise`) cross-check</text>
  <text x="392" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  via CDF Gaussian fit P('1' | ΔVin)!</text>
  <rect x="722" y="358" width="322" height="202" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="725" y1="364" x2="725" y2="554" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="734" y="376" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="bold">Free-Running Ring / LC-VCO</text>
  <text x="734" y="393" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• Autonomous PSS: Leave `fund` as initial</text>
  <text x="734" y="409" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  estimate, specify oscillator differential nodes,</text>
  <text x="734" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  `tstab` ≥ 20–100 cycles until amplitude settles!</text>
  <text x="734" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">• PNoise (`noisetype=sources` or `pm`, sweep</text>
  <text x="734" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  `relharmnum=1`, Δf = 100 Hz .. 100 MHz):</text>
  <text x="734" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  Extracts L(Δf) [dBc/Hz], RMS jitter, AND</text>
  <text x="734" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.9" fill="#0f172a" text-anchor="start">  per-transistor flicker vs thermal contributors!</text>
</svg>
