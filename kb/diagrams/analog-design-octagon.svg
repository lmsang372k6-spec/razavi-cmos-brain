  <text x="181.21" y="195.21" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.2" fill="#0f172a" text-anchor="end" font-weight="bold">Power Dissipation</text>
  <text x="181.21" y="210.21" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" fill="#475569" text-anchor="end">Công suất tiêu tán</text>
  <rect x="615" y="84" width="400" height="226" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="618" y1="90" x2="618" y2="304" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="627" y="102" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.6" fill="#1d4ed8" text-anchor="start" font-weight="bold">Canonical Octagon Couplings (Razavi §1.4)</text>
  <text x="627" y="119" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">1. Gain vs Speed: Higher Rout boosts Av = gm*Rout</text>
  <text x="627" y="135" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">   but lowers output pole wp = 1/(Rout*CL).</text>
  <text x="627" y="151" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">2. Gain vs Voltage Swing: Cascoding boosts Av ~ (gm*ro)^2</text>
  <text x="627" y="167" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">   at the direct cost of VDS,min headroom per stacked device.</text>
  <text x="627" y="183" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">3. Noise vs Power: Input thermal noise Vn^2 = 4kT*gamma/gm</text>
  <text x="627" y="199" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">   halves only when ID and W scale up by 2x (Linear Scaling).</text>
  <text x="627" y="215" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">4. Linearity vs Swing &amp; VDD: Larger Vov widens linear</text>
  <text x="627" y="231" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">   diff-pair range sqrt(2)*Vov but eats output headroom.</text>
  <rect x="615" y="328" width="400" height="234" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="618" y1="334" x2="618" y2="556" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="627" y="346" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.6" fill="#047857" text-anchor="start" font-weight="bold">Abstraction Levels &amp; Process-Agnostic Rule</text>
  <text x="627" y="363" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">• Physics Level: Carrier velocity sat vsat, DIBL, oxide tox</text>
  <text x="627" y="379" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">• Device Level: gm/ID, VDS,min, intrinsic gain gm*ro, fT</text>
  <text x="627" y="395" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">• Circuit Level: CS, Cascode, Diff-Pair, Mirrors, OTA</text>
  <text x="627" y="411" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">• Architecture Level: Two-Stage, Folded, BGR, CP-PLL</text>
  <text x="627" y="443" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">PDK-Agnostic Invariant (180nm -&gt; 90nm -&gt; 65nm -&gt; 45nm):</text>
  <text x="627" y="459" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">Topology trade-off laws remain invariant; express rules</text>
  <text x="627" y="475" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start">in VDS,min, gm/ID, gm*ro, and M:N finger ratios.</text>
</svg>
