  <text x="46" y="435" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Pelgrom Law:  σ(ΔVTH) = AVTH / √(W · L)</text>
  <text x="46" y="451" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Input Offset: VOS = ΔVTH + (Vov / 2) · [Δ(W/L)/(W/L) + ΔRD/RD]</text>
