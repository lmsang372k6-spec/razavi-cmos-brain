  <text x="302" y="535" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#059669" text-anchor="middle" font-weight="bold">During φs:  VGS(MS) = (Vin + VDD) − Vin = VDD = CONSTANT!</text>
  <rect x="624" y="76" width="416" height="158" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <line x1="627" y1="82" x2="627" y2="228" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="636" y="94" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.1" fill="#b91c1c" text-anchor="start" font-weight="bold">1. Why CMOS TG Fails at Low VDD (90nm/65nm/45nm)</text>
  <text x="636" y="111" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• When VDD drops near or below VTH,N + |VTH,P| (~0.9 V),</text>
  <text x="636" y="127" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  NEITHER NMOS nor PMOS conducts strongly near Vin ≈ VDD/2!</text>
  <text x="636" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Ron(Vin) spikes into a huge nonlinear 'dead-zone' bell,</text>
  <text x="636" y="159" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  causing severe HD3 harmonic distortion in high-ENOB ADCs.</text>
  <rect x="624" y="248" width="416" height="158" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <line x1="627" y1="254" x2="627" y2="400" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="636" y="266" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.1" fill="#1d4ed8" text-anchor="start" font-weight="bold">2. Constant Overdrive &amp; High Linearity</text>
  <text x="636" y="283" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Flying cap Cb acts as a floating VDD battery tied to Vin:</text>
  <text x="636" y="299" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  Ron ≈ 1 / [μn·Cox·(W/L)·(VDD − VTH(Vin))]</text>
  <text x="636" y="315" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Only tiny residual body-effect ΔVTH(VSB) remains (eliminated</text>
  <text x="636" y="331" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  completely if MS sits in an isolated Deep N-Well tied to Vin!).</text>
  <text x="636" y="347" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Note: Parasitic Cp at top plate attenuates VG to Cb/(Cb+Cp)·VDD.</text>
  <rect x="624" y="420" width="416" height="146" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="627" y1="426" x2="627" y2="560" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="636" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.1" fill="#047857" text-anchor="start" font-weight="bold">3. Oxide Reliability (SOA) Invariant!</text>
  <text x="636" y="455" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">• Even though absolute VG reaches 2·VDD when Vin = VDD,</text>
  <text x="636" y="471" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  EVERY terminal difference across MS stays ≤ VDD:</text>
  <text x="636" y="487" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  VGS = VDD ,   VGD ≈ VDD (since Vout ≈ Vin),   VGB ≤ 2·VDD</text>
  <text x="636" y="503" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start">  (Use Deep N-Well body tie + cascade shield on Soff NMOS!).</text>
</svg>
