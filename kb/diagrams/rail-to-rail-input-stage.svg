  <text x="602" y="393" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Unity-gain frequency ω_u = Gm,tot / Cc doubles at mid-rail,</text>
  <text x="602" y="409" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  eroding Phase Margin OR wasting 2x speed at the rails!</text>
  <text x="602" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Fix 1 (Square-Law 4x Tail Boost): Current switch steals ISS when</text>
  <text x="602" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  one pair turns off and boosts active pair tail to 4·ISS -&gt; gm = 2·gm0!</text>
  <text x="602" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Fix 2 (Weak-Inversion 1:1 Current Steering): Since gm = ID/(ζVT),</text>
  <text x="602" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">  keeping ISS,P + ISS,N = I_const automatically holds Gm,tot constant!</text>
  <text x="602" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" fill="#0f172a" text-anchor="start">• Note: Input offset VOS still transitions from VOS,P to VOS,N -&gt; THD!</text>
</svg>
