  <text x="282" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="bold">VOUT = VIN · D_buck / (1 - D_boost)   (Non-Inverting Positive Rail!)</text>
  <rect x="36" y="454" width="494" height="132" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
