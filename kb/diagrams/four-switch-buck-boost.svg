  <text x="48" y="472" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#047857" text-anchor="start" font-weight="bold">Why 3-Mode Beats Naive 1-Mode 4-Switch PWM</text>
  <text x="48" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Naive 1-Mode (S1+S3 @ D, S2+S4 @ 1-D): Switches ALL 4 FETs every</text>
  <text x="48" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  cycle with I_L = I_out/(1-D) = 2·I_out at VIN=VOUT -&gt; 4x I²R loss!</text>
  <text x="48" y="521" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Optimal 3-Mode: Pure Buck (S4=ON, S3=OFF: only S1/S2 switch, I_L=I_out)</text>
  <text x="48" y="537" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  &amp; Pure Boost (S1=ON, S2=OFF: only S3/S4 switch) -&gt; η_peak &gt; 96%!</text>
