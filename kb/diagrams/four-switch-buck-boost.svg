  <text x="828" y="381" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold">Input-to-Output Ratio  (VIN / VOUT)</text>
