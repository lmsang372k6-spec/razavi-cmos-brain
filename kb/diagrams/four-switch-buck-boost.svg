  <line x1="585" y1="396" x2="585" y2="580" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="594" y="408" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#b45309" text-anchor="start" font-weight="bold">Solving the VIN ≈ VOUT Minimum Pulse-Width Dead-Zone</text>
  <text x="594" y="425" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Hardware Limit: Gate drivers &amp; C_BST refresh enforce minimum</text>
  <text x="594" y="441" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  on/off pulses t_on,min &amp; t_off,min (~30–60 ns -&gt; ±6% dead-band @ 1 MHz).</text>
  <text x="594" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Without Bridge Region: Jumping directly from D_buck=94% to D_boost=6%</text>
  <text x="594" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  causes chaotic mode toggling &amp; 40–80 mVpp VOUT subharmonic bursts!</text>
  <text x="594" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">• Dual-Carrier Solution: Offset Buck &amp; Boost sawtooth ramps so Vc</text>
  <text x="594" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  smoothly overlaps ~8–12% duty in both half-bridges across VIN ≈ VOUT,</text>
  <text x="594" y="521" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" fill="#0f172a" text-anchor="start">  plus scale modulator gain by (1 - D_boost) to hold f_c constant!</text>
</svg>
