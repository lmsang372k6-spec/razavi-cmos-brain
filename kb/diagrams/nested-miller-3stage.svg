  <line x1="39" y1="440" x2="39" y2="554" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="48" y="452" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="bold">Why Nanometer Low-VDD Design Needs 3-Stage NMC</text>
  <text x="48" y="469" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• At 65nm/45nm (VDD ≤ 1.0 V, gm·ro ≈ 8–12), cascode stacking crushes output swing,</text>
  <text x="48" y="485" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  while a 2-stage op-amp reaches only (gm·ro)² ≈ 38–42 dB DC gain!</text>
  <text x="48" y="501" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">• Three cascaded low-headroom CS stages achieve Av0 = (gm·ro)³ ≈ 60–75 dB</text>
  <text x="48" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" fill="#0f172a" text-anchor="start">  with full rail-to-rail Vout swing (VDS,sat to VDD - VDS,sat)!</text>
  <rect x="662" y="114" width="382" height="152" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <line x1="665" y1="120" x2="665" y2="260" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <text x="674" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#b45309" text-anchor="start" font-weight="bold">1. Standard NMC Stability Dimensioning</text>
  <text x="674" y="149" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• For 60° Phase Margin (Butterworth 3rd-order closed-loop):</text>
  <text x="674" y="165" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  1) Outer unity-gain BW:   ω_u = gm1 / Cm1</text>
  <text x="674" y="181" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  2) Inner loop pole:       ω_p2 = gm2 / Cm2 ≈ 2 · ω_u</text>
  <text x="674" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  3) Output stage pole:     ω_p3 = gm3 / CL  ≥ 4 · ω_u</text>
  <text x="674" y="213" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Requires heavy gm3 (power hungry for large CL)!</text>
  <rect x="662" y="282" width="382" height="140" rx="7" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <line x1="665" y1="288" x2="665" y2="416" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
  <text x="674" y="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#6d28d9" text-anchor="start" font-weight="bold">2. RHP Zero Trap &amp; Multipath Fix (MNMC / RNMC)</text>
  <text x="674" y="317" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Cm1 &amp; Cm2 create feedforward RHP zeros that degrade PM!</text>
  <text x="674" y="333" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Multipath gmf (or Reversed NMC taking Cm2 to cascode</text>
  <text x="674" y="349" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  node instead of gate) cancels RHP zero &amp; relaxes gm3/gm1</text>
  <text x="674" y="365" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  by 2x–5x for high-capacitance load driving!</text>
  <rect x="662" y="438" width="382" height="122" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <line x1="665" y1="444" x2="665" y2="554" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <text x="674" y="456" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.9" fill="#047857" text-anchor="start" font-weight="bold">3. Spectre STB Verification Contract</text>
  <text x="674" y="473" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Break outer feedback loop with iprobe -&gt; check PM ≥ 60°</text>
  <text x="674" y="489" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">  AND Gain Margin GM ≥ 10 dB across CL_min .. CL_max!</text>
  <text x="674" y="505" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" fill="#0f172a" text-anchor="start">• Check step response for zero hidden sub-loop ringing!</text>
</svg>
